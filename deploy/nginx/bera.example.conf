# Example only: the real names and certificate paths are filled in on the server.
# Staging and production side by side. Each sends /api/ to its own API process and everything else
# to its own web process. Behind Cloudflare there are two proxies in front of the app (Cloudflare
# and nginx), so TRUSTED_PROXY_COUNT=2.
#
# Who may connect:
#   1. the firewall (deploy/harden/cloudflare_firewall.py) lets only Cloudflare reach 80 and 443;
#   2. Authenticated Origin Pulls: a request must carry OUR client certificate (made by
#      deploy/harden/origin_pull_certificate.py, one per environment, uploaded to Cloudflare);
#      nginx trusts only that, and closes the connection otherwise;
#   3. an address or name that is not ours gets no certificate and no answer.
# The site certificate is a Cloudflare Origin CA certificate (the firewall also keeps Let's
# Encrypt's web check out, and only Cloudflare ever connects here); set Cloudflare's SSL mode to
# "Full (strict)".

# Any name we do not serve, including a visit by the server's own IP address: the TLS handshake is
# refused (no certificate is shown) and plain web traffic is closed with no answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
}

# ---- staging ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name staging.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.example.com;
    ssl_certificate         /etc/bera/tls/staging-origin.pem;
    ssl_certificate_key     /etc/bera/tls/staging-origin.key;
    ssl_client_certificate  /etc/bera/tls/staging-origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;
    # No valid client certificate: close the connection without an answer.
    error_page 495 496 497 = @closed;
    location @closed { return 444; }

    client_max_body_size 25m;
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- production -------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.com;
    ssl_certificate         /etc/bera/tls/production-origin.pem;
    ssl_certificate_key     /etc/bera/tls/production-origin.key;
    ssl_client_certificate  /etc/bera/tls/production-origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;
    error_page 495 496 497 = @closed;
    location @closed { return 444; }

    client_max_body_size 25m;
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
