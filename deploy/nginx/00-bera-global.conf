# Goes in /etc/nginx/conf.d/ (read inside the http block, before the sites).
server_tokens off;                      # no version in headers or error pages
ssl_protocols TLSv1.2 TLSv1.3;          # nothing older
ssl_session_tickets off;
ssl_session_timeout 1d;
ssl_session_cache shared:bera_tls:10m;
