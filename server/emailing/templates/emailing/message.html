<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f4f5f3;font-family:Arial,Helvetica,sans-serif;color:#1b1f1a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #d9ddd6;border-radius:4px;">
            <tr>
              <td style="padding:24px 32px;border-bottom:1px solid #d9ddd6;font-size:20px;font-weight:bold;">Bera</td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 16px;font-size:20px;">{{ heading }}</h1>
                {% for paragraph in paragraphs %}<p style="margin:0 0 16px;font-size:15px;line-height:1.5;">{{ paragraph }}</p>
                {% endfor %}<p style="margin:24px 0;">
                  <a href="{{ link }}" style="display:inline-block;padding:12px 24px;background:#5bd62a;color:#0d100c;font-weight:bold;text-decoration:none;border-radius:4px;">{{ button_label }}</a>
                </p>
                <p style="margin:0;font-size:13px;color:#4d554a;">If you did not expect this email, you can ignore it.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
